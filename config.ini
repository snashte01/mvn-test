[server]
port = 8080
host = 0.0.0.0

[filesystem]
default_threshold = 70

[ansible]
playbook_dir    = ansible/playbooks
inventory       = ansible/inventory/hosts.ini
timeout         = 300
remote_user     = your_user_id
# Your sudo password (same as your login password).
# Protect this file: chmod 600 config.ini
become_password = your_password_here

[paths]
tmp_dir = /tmp/sap_mgmt
db_path = db/audit.db

[systems]
# Format: SID:hostname:instance_number:role  (comma-separated)
# role = primary | secondary
# Example:
# hosts = S4H:hana-node1:00:primary, S4H:hana-node2:00:secondary, ECC:ecc-hana:00:primary
hosts =

[landscape]
# hostname = SID:instance:role
# role: hana_primary, hana_secondary, ascs, ers, app
sapns2s4npdb  = S41:00:hana_primary
sapns2s4nphdb = S41:00:hana_secondary
sapns2s4npscs = S41:01:ascs
sapns2s4npers = S41:11:ers
sapns2s4npas1 = S41:00:app
sapns2s4npas2 = S41:00:app
